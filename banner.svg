<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="280" fill="#ffffff"/>

  <!-- scattered paw prints, right side -->
  <g fill="#ffe3cc">
    <g transform="translate(920,60) scale(1.1)">
      <circle cx="0" cy="14" r="10"/>
      <circle cx="-16" cy="-2" r="6"/>
      <circle cx="16" cy="-2" r="6"/>
      <circle cx="-9" cy="-16" r="5.5"/>
      <circle cx="9" cy="-16" r="5.5"/>
    </g>
    <g transform="translate(1040,150) scale(0.85) rotate(18)">
      <circle cx="0" cy="14" r="10"/>
      <circle cx="-16" cy="-2" r="6"/>
      <circle cx="16" cy="-2" r="6"/>
      <circle cx="-9" cy="-16" r="5.5"/>
      <circle cx="9" cy="-16" r="5.5"/>
    </g>
    <g transform="translate(1110,60) scale(0.7) rotate(-12)">
      <circle cx="0" cy="14" r="10"/>
      <circle cx="-16" cy="-2" r="6"/>
      <circle cx="16" cy="-2" r="6"/>
      <circle cx="-9" cy="-16" r="5.5"/>
      <circle cx="9" cy="-16" r="5.5"/>
    </g>
    <g transform="translate(970,210) scale(0.65) rotate(8)">
      <circle cx="0" cy="14" r="10"/>
      <circle cx="-16" cy="-2" r="6"/>
      <circle cx="16" cy="-2" r="6"/>
      <circle cx="-9" cy="-16" r="5.5"/>
      <circle cx="9" cy="-16" r="5.5"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#ff8a3d">Tails</text>

  <!-- tagline -->
  <text x="64" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#3a352f">
    반려동물과 함께 갈 수 있는 장소를 찾고, 여행을 계획하세요.
  </text>

  <!-- divider -->
  <line x1="64" y1="196" x2="700" y2="196" stroke="#e8e2d9" stroke-width="1.5"/>

  <!-- icon row -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#55504a">
    <g transform="translate(64,224)">
      <circle cx="10" cy="8" r="9" fill="#fff1e6" stroke="#ff8a3d" stroke-width="1.5"/>
      <path d="M6 8h8M10 4v8" stroke="#ff8a3d" stroke-width="1.6" stroke-linecap="round"/>
      <text x="28" y="14">장소 검색</text>
    </g>
    <g transform="translate(200,224)">
      <circle cx="10" cy="8" r="9" fill="#fff1e6" stroke="#ff8a3d" stroke-width="1.5"/>
      <path d="M6 11l4-6 4 6z" fill="none" stroke="#ff8a3d" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="28" y="14">개인화 추천</text>
    </g>
    <g transform="translate(350,224)">
      <circle cx="10" cy="8" r="9" fill="#fff1e6" stroke="#ff8a3d" stroke-width="1.5"/>
      <path d="M5 11c0-3 2-5 5-5s5 2 5 5" fill="none" stroke="#ff8a3d" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="10" cy="5" r="1.6" fill="#ff8a3d"/>
      <text x="28" y="14">여행 일정</text>
    </g>
    <g transform="translate(490,224)">
      <circle cx="10" cy="8" r="9" fill="#fff1e6" stroke="#ff8a3d" stroke-width="1.5"/>
      <path d="M6 5h8v7l-4-2-4 2z" fill="none" stroke="#ff8a3d" stroke-width="1.3" stroke-linejoin="round"/>
      <text x="28" y="14">커뮤니티</text>
    </g>
  </g>
